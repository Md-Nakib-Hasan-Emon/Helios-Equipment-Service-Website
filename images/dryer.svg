<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Compressed-air dryer with filters</title>
  <desc id="d">Illustration of an air dryer unit with a dew point display, with a filter housing on each side connected by air pipes.</desc>
  <rect width="800" height="600" fill="#e6eef0"/>
  <path d="M0 480 H800" stroke="#9db3b9" stroke-width="3"/>
  <rect x="0" y="480" width="800" height="120" fill="#dbe6e9"/>

  <!-- pipes behind the units -->
  <g stroke-linecap="round" fill="none">
    <path d="M40 300 H150" stroke="#b9531c" stroke-width="12"/>
    <path d="M200 300 H270" stroke="#b9531c" stroke-width="12"/>
    <path d="M530 300 H600" stroke="#0f6e78" stroke-width="12"/>
    <path d="M650 300 H760" stroke="#0f6e78" stroke-width="12"/>
  </g>

  <g stroke="#0f2128" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <rect x="270" y="452" width="60" height="24" fill="#435c66"/>
    <rect x="470" y="452" width="60" height="24" fill="#435c66"/>
    <!-- main dryer unit -->
    <rect x="250" y="170" width="300" height="284" rx="10" fill="#ffffff"/>
    <rect x="250" y="170" width="300" height="44" rx="10" fill="#f6f9f9"/>
    <!-- display -->
    <rect x="280" y="236" width="140" height="70" rx="6" fill="#0f2128"/>
    <rect x="290" y="246" width="120" height="50" rx="3" fill="#0f6e78"/>
    <path d="M300 280 L324 266 L350 274 L376 258 L400 268" stroke="#ffffff" stroke-width="3" fill="none"/>
    <circle cx="468" cy="256" r="11" fill="#ffffff"/>
    <circle cx="468" cy="290" r="11" fill="#b9531c"/>
    <!-- vents -->
    <path d="M280 342 H520 M280 362 H520 M280 382 H520 M280 402 H520" stroke="#9db3b9"/>
    <!-- left filter housing -->
    <rect x="100" y="240" width="100" height="170" rx="16" fill="#f6f9f9"/>
    <rect x="124" y="410" width="52" height="40" rx="8" fill="#ffffff"/>
    <path d="M100 280 H200" stroke="#9db3b9"/>
    <rect x="140" y="222" width="20" height="18" rx="3" fill="#ffffff"/>
    <!-- right filter housing -->
    <rect x="600" y="240" width="100" height="170" rx="16" fill="#f6f9f9"/>
    <rect x="624" y="410" width="52" height="40" rx="8" fill="#ffffff"/>
    <path d="M600 280 H700" stroke="#9db3b9"/>
    <rect x="640" y="222" width="20" height="18" rx="3" fill="#ffffff"/>
  </g>
</svg>
