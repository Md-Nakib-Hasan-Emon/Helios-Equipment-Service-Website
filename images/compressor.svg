<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Screw compressor with air receiver</title>
  <desc id="d">Illustration of an enclosed screw compressor cabinet with a display and louvres, connected to a vertical air receiver tank with a pressure gauge.</desc>
  <rect width="800" height="600" fill="#e6eef0"/>
  <path d="M0 480 H800" stroke="#9db3b9" stroke-width="3"/>
  <rect x="0" y="480" width="800" height="120" fill="#dbe6e9"/>

  <g stroke="#0f2128" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- base frame -->
    <rect x="130" y="452" width="420" height="26" fill="#435c66"/>
    <!-- cabinet -->
    <rect x="150" y="130" width="380" height="322" rx="10" fill="#ffffff"/>
    <rect x="150" y="130" width="380" height="40" rx="10" fill="#f6f9f9"/>
    <path d="M180 150 H260 M290 150 H370" stroke="#9db3b9"/>
    <!-- display -->
    <rect x="182" y="192" width="170" height="86" rx="6" fill="#0f2128"/>
    <rect x="192" y="202" width="150" height="66" rx="3" fill="#0f6e78"/>
    <path d="M202 252 L226 232 L252 244 L282 220 L330 238" stroke="#ffffff" stroke-width="3" fill="none"/>
    <circle cx="400" cy="214" r="12" fill="#b9531c"/>
    <circle cx="440" cy="214" r="12" fill="#ffffff"/>
    <circle cx="480" cy="214" r="12" fill="#ffffff"/>
    <!-- louvres -->
    <path d="M182 312 H498 M182 330 H498 M182 348 H498 M182 366 H498 M182 384 H498 M182 402 H498 M182 420 H498" stroke="#9db3b9"/>
    <!-- air receiver -->
    <rect x="590" y="220" width="120" height="232" rx="58" fill="#f6f9f9"/>
    <path d="M590 300 H710" stroke="#9db3b9"/>
    <rect x="628" y="204" width="44" height="22" rx="4" fill="#ffffff"/>
    <rect x="610" y="452" width="80" height="26" fill="#435c66"/>
    <!-- gauge on tank -->
    <circle cx="650" cy="168" r="28" fill="#ffffff"/>
    <path d="M650 168 L666 152" stroke="#b9531c" stroke-width="4"/>
    <circle cx="650" cy="168" r="4" fill="#0f2128"/>
    <path d="M650 196 V204" />
  </g>

  <!-- air pipe from cabinet to receiver and onward -->
  <g stroke-linecap="round" fill="none">
    <path d="M530 360 H590" stroke="#b9531c" stroke-width="12"/>
    <path d="M710 400 H760" stroke="#0f6e78" stroke-width="12"/>
  </g>
</svg>
