<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Air-cooled industrial chiller</title>
  <desc id="d">Illustration of a roof-mounted chiller with two fans on top, louvred side panels, a control panel and two pipe connections.</desc>
  <rect width="800" height="600" fill="#e6eef0"/>
  <path d="M0 470 H800" stroke="#9db3b9" stroke-width="3"/>
  <rect x="60" y="470" width="680" height="130" fill="#dbe6e9"/>

  <g stroke="#0f2128" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <rect x="150" y="440" width="70" height="26" fill="#435c66"/>
    <rect x="580" y="440" width="70" height="26" fill="#435c66"/>
    <!-- lower body -->
    <rect x="110" y="270" width="580" height="172" fill="#ffffff"/>
    <!-- upper coil bank with fans -->
    <rect x="110" y="140" width="580" height="130" fill="#f6f9f9"/>
    <path d="M110 160 H690" stroke="#9db3b9"/>
    <circle cx="270" cy="205" r="52" fill="#ffffff"/>
    <circle cx="270" cy="205" r="38" fill="none" stroke="#9db3b9"/>
    <path d="M270 205 L270 162 M270 205 L307 226 M270 205 L233 226" stroke-width="5"/>
    <circle cx="270" cy="205" r="9" fill="#0f2128"/>
    <circle cx="530" cy="205" r="52" fill="#ffffff"/>
    <circle cx="530" cy="205" r="38" fill="none" stroke="#9db3b9"/>
    <path d="M530 205 L530 162 M530 205 L567 226 M530 205 L493 226" stroke-width="5"/>
    <circle cx="530" cy="205" r="9" fill="#0f2128"/>
    <!-- louvres -->
    <path d="M135 296 H335 M135 314 H335 M135 332 H335 M135 350 H335 M135 368 H335 M135 386 H335 M135 404 H335 M135 422 H335" stroke="#9db3b9"/>
    <!-- control panel -->
    <rect x="390" y="292" width="150" height="120" rx="6" fill="#f6f9f9"/>
    <rect x="406" y="308" width="118" height="46" rx="3" fill="#0f6e78"/>
    <path d="M416 336 L436 326 L456 340 L476 322 L506 334" stroke="#ffffff" stroke-width="3" fill="none"/>
    <circle cx="428" cy="382" r="9" fill="#ffffff"/>
    <circle cx="464" cy="382" r="9" fill="#ffffff"/>
    <circle cx="500" cy="382" r="9" fill="#b9531c"/>
    <!-- side door handle -->
    <rect x="590" y="330" width="14" height="60" rx="5" fill="#ffffff"/>
  </g>

  <!-- pipe connections -->
  <g stroke-linecap="round">
    <path d="M690 372 H748" stroke="#b9531c" stroke-width="12"/>
    <path d="M690 410 H748" stroke="#0f6e78" stroke-width="12"/>
  </g>
  <g stroke="#0f2128" stroke-width="3" fill="#ffffff">
    <rect x="728" y="358" width="14" height="28" rx="2"/>
    <rect x="728" y="396" width="14" height="28" rx="2"/>
  </g>
</svg>
